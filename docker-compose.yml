version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: recommendai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: recommendai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recommendai_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@db:5432/recommendai_db"
      SECRET_KEY: "supersecretrecommendai-key-change-in-production-2026"
      WEIGHT_COLLABORATIVE: 0.45
      WEIGHT_CONTENT: 0.35
      WEIGHT_POPULARITY: 0.20
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ml:/ml

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recommendai_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
