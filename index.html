      /* Ground: true ink black — everything on it reads */
      --bg-primary:   #07080C;
      --bg-elevated:  #0D0E12;
      --bg-surface:   #111318;
      --bg-card:      #0D0E12;

      /* Borders: quiet 1px — panels separate, don't shout */
      --border-subtle: rgba(255,255,255,0.07);
      --border-hover:  rgba(255,255,255,0.15);

      /* Type: primary reads clearly, secondary recedes */
      --text-primary:   #F2F0EB;
      --text-secondary: #7A7C85;
      --text-muted:     #4A4C55;

      /* ONE accent: warm cream — used once, means something */
      --accent-primary:   #D4C5A9;  /* warm cream — the decided accent */
      --accent-secondary: #D4C5A9;  /* same — no rainbow */
      --accent-tertiary:  #E05C3A;  /* only for error/remove states */
      --accent-data:      #4D7EFF;  /* only for data bars — cool blue */

      --radius-sm: 4px;

      --radius-lg: 8px;

      --font-sans:    'Inter', system-ui, -apple-system, sans-serif;

      border: 1px solid var(--border-subtle);

      border: 1px solid var(--border-subtle);

    .glass-card:hover {

    }

      border-radius: 50%;

    }

      position: absolute; inset: 12px;

      background: radial-gradient(circle at 40% 40%, rgba(124,92,252,0.25), rgba(0,212,170,0.15) 50%, transparent 70%);

      z-index: 2;

  <script>
    // ===== NEURAL NETWORK PARTICLE BACKGROUND =====
    (function initNeuralCanvas() {
      const canvas = document.getElementById('neural-canvas');
      const ctx = canvas.getContext('2d');
      let w, h, particles = [], mouse = { x: -1000, y: -1000 };
      const PARTICLE_COUNT = 60;
      const MAX_DIST = 150;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
          x: Math.random() * w, y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25,
          r: Math.random() * 1.2 + 0.4,
          color: Math.random() > 0.4 ? 'rgba(212,197,169,' : 'rgba(255,255,255,'
        });
      }

      document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

      function animate() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach((p, i) => {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0 || p.x > w) p.vx *= -1;
          if (p.y < 0 || p.y > h) p.vy *= -1;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color + '0.22)';
          ctx.fill();

          for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dx = p.x - p2.x, dy = p.y - p2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < MAX_DIST) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = 'rgba(212,197,169,' + (1 - dist / MAX_DIST) * 0.045 + ')';
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }

          const mdx = p.x - mouse.x, mdy = p.y - mouse.y;
          const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
          if (mdist < 180) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.strokeStyle = 'rgba(212,197,169,' + (1 - mdist / 180) * 0.08 + ')';
            ctx.lineWidth = 0.6;
            ctx.stroke();
          }
        });
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>

    function getProductBundles(productId) {
      if (ASSOCIATION_BUNDLES[productId] && ASSOCIATION_BUNDLES[productId].length > 0) {
        return ASSOCIATION_BUNDLES[productId];

      const candidates = PRODUCTS_DATA.filter(p => p.id !== productId);
      return candidates.slice(0, 2).map((c, idx) => ({
        pid: c.id,
        lift: Number((2.3 + idx * 0.4).toFixed(2)),

      }));

    // ===== IN-BROWSER ML ENGINES =====

    // 1. TF-IDF Tokenizer & Cosine Similarity
    function computeTFIDFSimilarity(productA, productB) {
      const getTokens = (p) => {
        const text = `${p.title} ${p.brand} ${p.category} ${p.subcategory || ''} ${(p.tags || []).join(' ')} ${p.description}`.toLowerCase();
        return text.replace(/[^\w\s]/g, ' ').split(/\s+/).filter(w => w.length > 2);
      };
      const tokensA = getTokens(productA), tokensB = getTokens(productB);
      const freqA = {}, freqB = {};
      tokensA.forEach(t => freqA[t] = (freqA[t] || 0) + 1);
      tokensB.forEach(t => freqB[t] = (freqB[t] || 0) + 1);
      const allTokens = new Set([...Object.keys(freqA), ...Object.keys(freqB)]);
      let dot = 0, normA = 0, normB = 0;
      allTokens.forEach(t => {
        const a = (freqA[t] || 0), b = (freqB[t] || 0);
        dot += a * b; normA += a * a; normB += b * b;
      });
      if (normA === 0 || normB === 0) return 0;
      return dot / (Math.sqrt(normA) * Math.sqrt(normB));
    }

    // 2. Multi-Model Hybrid Scoring with MMR Diversity Re-ranking
    function generateHybridRecommendations(userHistory, userInterests, currentPersonaKey, limit = 8) {
      const validProducts = PRODUCTS_DATA.filter(p => !userHistory.includes(p.id));

      const scored = validProducts.map(prod => {
        let contentScore = 0;
        if (userHistory.length > 0) {
          const sims = userHistory.map(hid => {
            const hProd = PRODUCTS_DATA.find(p => p.id === hid);
            return hProd ? computeTFIDFSimilarity(prod, hProd) : 0;
          });
          contentScore = sims.reduce((a, b) => a + b, 0) / sims.length;
        } else if (userInterests && userInterests.length > 0) {
          contentScore = userInterests.includes(prod.category) ? 0.85 : 0.15;
        }

        let collabScore = 0;
        if (currentPersonaKey === 'rahul') {
          collabScore = prod.category === 'Gaming' ? 0.92 : prod.category === 'Computing' ? 0.70 : 0.15;
        } else if (currentPersonaKey === 'sneha') {
          collabScore = prod.category === 'Audio' ? 0.94 : prod.category === 'Desk Setup' ? 0.65 : 0.20;
        } else if (currentPersonaKey === 'alex') {
          collabScore = prod.category === 'Computing' ? 0.95 : prod.category === 'Desk Setup' ? 0.88 : 0.25;
        } else {
          collabScore = 0.5;
        }

        const popScore = (prod.rating / 5.0) * 0.6 + Math.min(1.0, prod.rating_count / 500) * 0.4;
        const finalScore = (0.45 * collabScore) + (0.35 * contentScore) + (0.20 * popScore);

        let reason = "Popular trending item in catalog.";
        let factor = "POPULAR_TRENDING";

        if (contentScore > 0.4 && contentScore >= collabScore) {
          factor = "CONTENT_SIMILARITY";
          const anchor = userHistory.length > 0 ? PRODUCTS_DATA.find(p => p.id === userHistory[0])?.title : null;
          reason = anchor ? `Similar specs and features to '${anchor}'` : `Matches your interest in ${prod.category}`;
        } else if (collabScore > 0.6) {
          factor = "COLLABORATIVE_FILTERING";
          reason = `Popular with shoppers who share your taste in ${prod.category}`;
        } else if (userInterests && userInterests.includes(prod.category)) {
          factor = "CATEGORY_INTEREST";
          reason = `Matches your chosen preference for ${prod.category}`;
        }

        return { product: prod, score: finalScore, contentScore, collabScore, popScore, explanation: { primary_factor: factor, reason_text: reason, final_score: finalScore } };
      });

      scored.sort((a, b) => b.score - a.score);

      // MMR Diversity Re-ranking (Lambda = 0.75)
      const lambdaMMR = 0.75;
      const selected = [];
      const pool = [...scored];

      if (pool.length > 0) selected.push(pool.shift());

      while (selected.length < limit && pool.length > 0) {
        let bestItem = null, bestMMR = -Infinity, bestIndex = -1;
        pool.forEach((candidate, idx) => {
          let maxSim = 0;
          selected.forEach(s => {
            const sim = computeTFIDFSimilarity(candidate.product, s.product);
            if (sim > maxSim) maxSim = sim;
          });
          const mmrVal = lambdaMMR * candidate.score - (1 - lambdaMMR) * maxSim;
          if (mmrVal > bestMMR) { bestMMR = mmrVal; bestItem = candidate; bestIndex = idx; }
        });
        if (bestItem && bestIndex !== -1) { selected.push(bestItem); pool.splice(bestIndex, 1); }
        else break;
      }
      return selected;
    }

      const [currentPersona, setCurrentPersona] = useState(PERSONAS.guest);
      const [userHistory, setUserHistory] = useState([]);
      const [userInterests, setUserInterests] = useState([]);
      const [currentPage, setCurrentPage] = useState('home');
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [showOnboarding, setShowOnboarding] = useState(false);

      const switchPersona = (key) => {
        const p = PERSONAS[key];
        setCurrentPersonaKey(key);
        setCurrentPersona(p);
        setUserHistory([...p.history]);
        setUserInterests([...(p.interests || [])]);
        setCurrentPage('home');
        setSelectedProduct(null);
      };

      const logInteraction = (productId) => {
        setUserHistory(prev => prev.includes(productId) ? prev : [productId, ...prev]);
      };

      const addToCart = (product) => {
        setCart(prev => {
          const existing = prev.find(item => item.product.id === product.id);
          if (existing) return prev.map(item => item.product.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          return [...prev, { product, qty: 1 }];
        });
        logInteraction(product.id);
        setIsCartOpen(true);
      };

      const recommendations = useMemo(() => {
        return generateHybridRecommendations(userHistory, userInterests, currentPersonaKey, 12);
      }, [userHistory, userInterests, currentPersonaKey]);

      const trendingProducts = useMemo(() => [
        PRODUCTS_DATA[3],  // LG UltraGear OLED
        PRODUCTS_DATA[4],  // MacBook Pro M3
        PRODUCTS_DATA[7],  // Sony WH-1000XM5
        PRODUCTS_DATA[9],  // Shure SM7B
        PRODUCTS_DATA[11], // BenQ ScreenBar
        PRODUCTS_DATA[15], // ASUS ROG Swift OLED
        PRODUCTS_DATA[19], // Samsung 990 PRO NVMe
        PRODUCTS_DATA[21]  // Focusrite Scarlett 2i2
      ], []);

      return (
        <div style={{ position: 'relative', zIndex: 1, minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          <Header
            persona={currentPersona}
            personaKey={currentPersonaKey}
            onSwitchPersona={switchPersona}
            onOpenAdmin={() => { setCurrentPage(currentPage === 'admin' ? 'home' : 'admin'); setSelectedProduct(null); }}
            isAdmin={currentPage === 'admin'}
            cart={cart}
            onOpenCart={() => setIsCartOpen(true)}
            searchQuery={searchQuery}
            onSearchChange={setSearchQuery}
          />

          <main className="container" style={{ flex: 1, paddingTop: 32, paddingBottom: 32 }}>
            {currentPage === 'admin' ? (
              <AdminDashboard recommendations={recommendations} onBack={() => setCurrentPage('home')} />
            ) : selectedProduct ? (
              <ProductDetail
                product={selectedProduct}
                onBack={() => setSelectedProduct(null)}
                onAddToCart={addToCart}
                onSelectProduct={(p) => {
                  setSelectedProduct(p);
                  logInteraction(p.id);
                  window.scrollTo({ top: 0, behavior: 'smooth' });
                }}
              />
            ) : (
              <StoreHome
                persona={currentPersona}
                recommendations={recommendations}
                trending={trendingProducts}
                searchQuery={searchQuery}
                onClearSearch={() => setSearchQuery('')}
                onSelectProduct={(p) => {
                  setSelectedProduct(p);
                  logInteraction(p.id);
                }}
                onAddToCart={addToCart}
                onOpenOnboarding={() => setShowOnboarding(true)}
              />
            )}
          </main>

          <Footer />

          {isCartOpen && (
            <CartDrawer
              cart={cart}
              onClose={() => setIsCartOpen(false)}
              onCheckout={() => {
                cart.forEach(item => logInteraction(item.product.id));
                alert("Simulated Checkout Complete! Purchase events recorded in interaction matrix.");
                setCart([]);
                setIsCartOpen(false);
              }}
            />
          )}

          {showOnboarding && (
            <OnboardingModal
              userInterests={userInterests}
              setUserInterests={setUserInterests}
              onClose={() => setShowOnboarding(false)}
            />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    
  </script>
</body>
</html>
